<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סלובקיה ופולין 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #c97b84;
            --secondary: #f4f7f1;
            --accent: #d4e4bc;
            --text: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--secondary);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.45;
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 1.4rem 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 0.8rem;
        }

        .card {
            background: var(--white);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 3px 5px rgba(0,0,0,0.05);
            border-right: 5px solid var(--primary);
        }

        h1 { margin: 0; font-size: 1.5rem; }
        h2 { color: var(--primary); border-bottom: 1px solid var(--accent); padding-bottom: 0.3rem; margin-top: 0; font-size: 1.1rem; }

    <!-- יום 3 -->
    <div class="card">
        <h2>יום 3 | 23/06 – פסגות ואקשן</h2>

        <ul>
            <li>
                עלייה ברכבל ל‑<strong>Lomnický Štít</strong>  
                (להזמין מראש ב‑
                <a href="https://www.gopass.travel/EN/attractions/detail/tatry-mountain-resorts-a-s/lomnicky-stit" target="_blank">
                    Gopass
                </a>)
            </li>

            <li>
                ירידה ב‑<strong>Mountain Carts</strong> (גו‑קארט הררי) –
                <a href="https://www.vt.sk/en/activities/mountain-carts" target="_blank">מידע</a>,
                מחיר: ~20–25€
            </li>

            <li>
                אחר הצהריים: הליכה רגועה באגם <strong>Štrbské Pleso</strong> –
                <a href="https://maps.google.com/?q=Strbske+Pleso" target="_blank">📍 ניווט</a>

                <div class="more-box">
                    <button class="show-more-btn" onclick="toggleMore(this)">הצג עוד</button>
                    <div class="more-content">
                        <ul>
                            <li>שייט בסירות / פדלים</li>
                            <li>עלייה ברכבל ל‑Solisko</li>
                            <li>מסלול Popradské Pleso</li>
                            <li>מסלול מפל Skok</li>
                            <li>אגמי האהבה – Jazierka Lásky</li>
                            <li>השכרת אופניים / אופניים חשמליים</li>
                            <li>זיפליין באזור Solisko</li>
                            <li>בתי קפה וגלידות על הטיילת</li>
                            <li>נקודות צילום מהממות</li>
                        </ul>
                    </div>
                </div>
            </li>
        </ul>

        <span class="cost-tag">💰 עלות: רכבל ~65€ | קארט ~20€</span>
        <a href="https://maps.google.com/?q=Tatranska+Lomnica+Parking" class="btn" target="_blank">📍 ניווט לרכבל</a>
    </div>

    <!-- יום 4 -->
    <div class="card">
        <h2>יום 4 | 24/06 – מערות וצמרות</h2>

        <ul>
            <li>
                מערת הנטיפים <strong>Belianska</strong> –
                <a href="https://maps.google.com/?q=Belianska+Cave" target="_blank">📍 ניווט</a> |
                <a href="https://www.ssj.sk/en/jaskyna/2-belianska-cave" target="_blank">🌐 אתר רשמי</a>

                <div class="more-box">
                    <button class="show-more-btn" onclick="toggleMore(this)">הצג עוד</button>
                    <div class="more-content">
                        <ul>
                            <li><strong>⏱ משך הסיור:</strong> ~70 דקות</li>
                            <li><strong>📏 אורך המסלול:</strong> 1,370 מטר</li>
                            <li><strong>🥶 טמפרטורה:</strong> 5–6.3°C</li>
                            <li><strong>🪜 מדרגות:</strong> 860 מדרגות</li>
                            <li><strong>⚠️ קר מאוד בפנים</strong> — חובה להביא מעיל גם בקיץ</li>
                            <li>⛔ אין הזמנות מראש — מגיעים בשעות הכניסה</li>
                            <li>⛰️ עלייה תלולה מהחניה (25–40 דקות)</li>
                            <li>📸 צילום עולה 50€</li>
                            <li>👣 סיור רק עם מדריך</li>
                            <li>💶 חניה בתשלום קטן (מזומן)</li>
                        </ul>
                    </div>
                </div>
            </li>

            <li>
                מסלול <strong>Bachledka</strong> – שביל צמרות העצים  
                <a href="https://maps.google.com/?q=Bachledka+Treetop+Walk" target="_blank">📍 ניווט</a>

                <div class="more-box">
                    <button class="show-more-btn" onclick="toggleMore(this)">הצג עוד</button>
                    <div class="more-content">
                        <ul>
                            <li><strong>⏰ שעות:</strong> 09:00–18:00</li>
                            <li><strong>💰 כניסה:</strong> מבוגר 17€ | ילד 14€</li>
                            <li><strong>🚡 רכבל:</strong> מבוגר 18€ | ילד 15€</li>
                            <li>🛝 מגלשה ענקית למעלה (~3€)</li>
                            <li>👶 מתאים לעגלות</li>
                            <li>🥾 אפשרות עלייה ברגל (45–60 דקות)</li>
                            <li>🌄 תצפית מדהימה בקצה המסלול</li>
                        </ul>
                    </div>
                </div>
            </li>
        </ul>
    </div>

    <!-- יום 5 -->
    <div class="card">
        <h2>יום 5 | 25/06 – Kluszkowce, אגם וטירה</h2>

        <ul>
            <li><strong>Kluszkowce – Czorsztyn Ski</strong> 🎢 יום מגלשות מטורף</li>
            <li>שייט/מנוחה ליד <strong>Lake Czorsztyn</strong></li>
            <li>ביקור ב‑<strong>Niedzica Castle</strong></li>
            <li>נסיעה חזרה לכיוון קרקוב</li>
        </ul>

        <a href="https://www.google.com/maps/dir/?api=1&origin=Tatransk%C3%A1+Lomnica&destination=Krak%C3%B3w+Airport&waypoints=Czorsztyn+Ski+Kluszkowce%7CNiedzica+Castle%7CLake+Czorsztyn"
           class="btn" target="_blank">
           📍 מסלול נסיעה מלא
        </a>

        <div class="more-box">
            <button class="show-more-btn" onclick="toggleMore(this)">הצג עוד</button>
            <div class="more-content">
                <ul>
                    <li><strong>🎢 מגלשות הרים:</strong> 10–15 zł לירידה</li>
                    <li><strong>🌊 אגם:</strong> שייט רגוע ותצפיות</li>
                    <li><strong>🏰 טירה:</strong> מבצר מהמאה ה‑14</li>
                    <li><strong>⏰ זמן כולל:</strong> 4–6 שעות</li>
                    <li><strong>🚗 נסיעה לקרקוב:</strong> ~1.5 שעות</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- יום 6 -->
    <div class="card" style="border-right-color:#333;">
        <h2>יום 6 | 26/06 – טיסה חזור</h2>

        <div class="flight-info">
            ✈️ <strong>טיסה W6 2097:</strong> המראה 05:40 | נחיתה 09:55
        </div>

        <p style="margin:0;">הגעה לשדה ב‑03:00. החזרת רכב עם מיכל מלא.</p>

        <a href="https://maps.google.com/?q=Krakow+Airport" class="btn" target="_blank">📍 ניווט לשדה</a>
    </div>

</div>

<div class="footer">
    נבנה עבור טיול משפחתי 2026 🏔️
</div>

<script>
function toggleMore(btn) {
    const content = btn.nextElementSibling;
    const open = content.style.display === "block";
    content.style.display = open ? "none" : "block";
    btn.textContent = open ? "הצג עוד" : "הסתר";
}
</script>

</body>
</html>
